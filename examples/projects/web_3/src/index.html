<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PCIDE Example</title><style>body{font:18px system-ui;margin:2rem}button,input{padding:.6rem}canvas{border:1px solid #aaa}</style><input id="task"><button id="add">添加任务</button><ul id="list"></ul><script>add.onclick=()=>{let li=document.createElement("li");li.textContent=task.value;li.onclick=()=>li.remove();list.append(li);task.value="";};</script></html>
