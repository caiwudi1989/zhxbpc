<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PCIDE Example</title><style>body{font:18px system-ui;margin:2rem}button,input{padding:.6rem}canvas{border:1px solid #aaa}</style><canvas id="c" width="600" height="300"></canvas><p>鼠标点击移动圆球</p><script>const ctx=c.getContext("2d");function draw(x,y){ctx.clearRect(0,0,600,300);ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.fill();}c.onclick=e=>{const r=c.getBoundingClientRect();draw((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);};draw(100,100);</script></html>
