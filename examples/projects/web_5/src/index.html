<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PCIDE Example</title><style>body{font:18px system-ui;margin:2rem}button,input{padding:.6rem}canvas{border:1px solid #aaa}</style><canvas id="c" width="600" height="300"></canvas><script>const ctx=c.getContext("2d");let frame,x=30;function tick(){ctx.clearRect(0,0,600,300);x=(x+2)%600;ctx.fillStyle="#1689ce";ctx.fillRect(x,130,30,30);frame=requestAnimationFrame(tick);}tick();addEventListener("pagehide",()=>cancelAnimationFrame(frame),{once:true});</script></html>
