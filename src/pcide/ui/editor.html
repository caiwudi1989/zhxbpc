<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body,#editor{width:100%;height:100%;margin:0;overflow:hidden;background:#fbfbfa!important;color:#202124}
#editor,.monaco-editor,.monaco-editor-background,.monaco-editor .margin,.monaco-editor .overflow-guard,
.monaco-editor .monaco-scrollable-element{background-color:#fbfbfa!important}
.monaco-editor .margin{background-color:#f3f5f7!important}
.pcide-breakpoint{background:#d5453e;border-radius:50%;width:10px!important;height:10px!important;margin:3px}

.routine-zone th{height:23px;background:#e7eee6;color:#35483e}
.routine-zone input,.routine-zone select{box-sizing:border-box;width:100%;min-width:0;height:26px;padding:2px 4px;border:1px solid transparent;background:transparent;color:#0000aa;font:inherit;outline:none;pointer-events:auto}
.routine-zone input:focus,.routine-zone select:focus{border-color:#176ac6;background:#fff;box-shadow:inset 0 0 0 1px #cfe3ff}
.routine-zone .routine-name-cell{display:flex;align-items:center;gap:2px;min-width:0}
.routine-zone .routine-name{flex:1;cursor:text;font-weight:600}
.routine-zone .routine-toggle{flex:none;width:18px;height:24px;padding:0;border:0;background:transparent;color:#35483e;font-size:15px;cursor:pointer}
.routine-zone .routine-public{width:17px;height:17px;padding:0;cursor:pointer;accent-color:#d52222;vertical-align:middle}
.routine-zone .routine-public-cell{text-align:center}
.routine-zone .routine-content[hidden]{display:none}
.routine-zone .routine-section{display:flex;align-items:center;gap:8px;height:27px;padding:0 6px;border:1px solid #b5c1bb;border-top:0;box-sizing:border-box;background:#f3f6f2;color:#526357}
.routine-zone .routine-section .routine-count{font-size:12px;color:#697970}
.routine-zone .routine-section button{margin-left:auto}
.routine-zone .routine-add-local,.routine-zone .routine-remove-local{height:22px;padding:0 6px;border:1px solid transparent;background:transparent;color:#176ac6;cursor:pointer;font:inherit;white-space:nowrap}
.routine-zone .routine-add-local:hover,.routine-zone .routine-remove-local:hover{border-color:#aeb9b2;background:#fff}
.routine-zone .routine-params th,.routine-zone .routine-locals th{border-top:0}
.routine-zone .routine-remove-local{width:100%;padding:0;font-size:12px}
.routine-zone.collapsed .routine-head{display:none}
#editor.source-fully-hidden .view-lines,#editor.source-fully-hidden .cursors-layer,
#editor.source-fully-hidden .view-overlays,#editor.source-fully-hidden .margin-view-overlays{visibility:hidden}
</style></head><body><div id="editor"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script>
'use strict';

  let path='',loading=false,decorations=[],completionItems=[],chinese=false,words={},zones=[],routineLayouts=[],routineCollapsed={},routineInfo={},startupRoutines=[],customTypes=[];
  function projectText(text,reverse=false){
   if(currentLanguage!=='python')return text;

  function metadataMatchesFile(item){

  }
  function scanRoutineRanges(model){

   }).split('\n');

   lines.forEach((line,index)=>{

   });
   if(currentLanguage==='zhxb')result.forEach((item,index)=>{item.endLine=result[index+1]?.line-1||lines.length;});

  }
  let hiddenSignature='',sourceFullyHidden=false,currentRoutineKey='';

     ['子程序名','返回值类型','公开','备注'].forEach(text=>{const th=document.createElement('th');th.textContent=text;head.appendChild(th);});

     const name=document.createElement('input');name.className='routine-name';name.type='text';name.readOnly=false;name.disabled=false;name.value=metadata.name;
     name.title=startup?'启动子程序标题；实际启动事件保持绑定':'子程序名称';name.setAttribute('aria-label',startup?'启动子程序标题':'子程序名称');nameCell.appendChild(name);row.insertCell().appendChild(nameCell);
     name.onchange=()=>{if(name.value===metadata.name)return;if(!/^[\p{L}_][\p{L}\p{N}_]*$/u.test(name.value)){name.value=metadata.name;return;}metadata.name=name.value;publish();};name.onblur=name.onchange;

     const returnTypes=[['无返回值',''],['文本型','文本型'],['数值型','数值型'],['整数型','整数型'],['长整数型','长整数型'],['小数型','小数型'],['双精度小数型','双精度小数型'],['逻辑型(布尔型)','逻辑型(布尔型)'],['字节型','字节型'],['日期时间型','日期时间型'],['字节集','字节集'],['对象型','对象型'],['数组型','数组型'],['自定义类型','自定义类型']];
     returnTypes.forEach(([label,value])=>returnCell.add(new Option(label,value)));customTypes.forEach(value=>returnCell.add(new Option(value,value)));

     const remark=document.createElement('input');remark.className='routine-remark';remark.value=metadata.remark;remark.placeholder='备注（注释）';remark.title='备注（注释）';remark.oninput=()=>{metadata.remark=remark.value;publish();};remark.onchange=remark.oninput;row.insertCell().appendChild(remark);frame.appendChild(table);
     const content=document.createElement('div');content.className='routine-content';frame.appendChild(content);
     const parameterBar=document.createElement('div');parameterBar.className='routine-section';
